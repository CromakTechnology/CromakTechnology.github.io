    <script>
        // 1. Lê a preferência salva pelo usuário (se houver)
        var savedLang = localStorage.getItem('idioma_preferido');
        
        // 2. Lê o idioma do navegador do usuário
        var browserLang = navigator.language || navigator.userLanguage;

        // 3. Lógica de Redirecionamento
        if (savedLang === 'pt' || (!savedLang && browserLang.toLowerCase().startsWith('pt'))) {
            // Manda para o site em Português
            window.location.replace('/pt/index.html');
        } else {
            // Se for Inglês ou qualquer outro idioma, cai no Padrão Global (Inglês)
            window.location.replace('/en/index.html');
        }
    </script>
